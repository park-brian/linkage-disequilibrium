<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LD — a variant set and its lenses</title>
<link rel="stylesheet" href="./set.css">
<script type="importmap">
{ "imports": {
  "hyparquet": "../node_modules/hyparquet/src/index.js",
  "hyparquet-compressors": "../node_modules/hyparquet-compressors/src/index.js",
  "fzstd": "../node_modules/fzstd/esm/index.mjs",
  "hysnappy": "../node_modules/hysnappy/js/index.js"
} }
</script>
<script type="module" src="./set/main.js"></script>
</head>
<body>
<header class="bar">
  <a class="mark" href="./set.html" title="Linkage disequilibrium in 1000 Genomes">LD</a>
  <div class="ask">
    <textarea id="q" rows="1" spellcheck="false" aria-label="Variants or a region"
      placeholder="rs3 · chr22:30,000,000-31,000,000 · or paste a list"></textarea>
    <div id="examples" class="hint"></div>
  </div>
  <div id="context" class="context"></div>
</header>
<main>
  <section id="set" aria-label="The variant set"></section>
  <section id="lens" aria-label="Lens">
    <nav id="lenses" aria-label="Lenses"></nav>
    <div id="head" class="head"></div>
    <div id="figure" class="figure"></div>
    <div id="foot" class="foot"></div>
  </section>
</main>
<footer>
  <span id="status" role="status"></span>
  <span>1000 Genomes · dbSNP 155 · numbers match LDlink exactly · <a href="./index.html">the LDlink modules</a></span>
</footer>
</body>
</html>
