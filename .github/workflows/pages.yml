# Deploy the app to GitHub Pages, after checks.yml passes (unit tests, the parity snapshot and the app against the
# hosted release): tools/build_site.js writes dist/ (app + src + vendored browser deps, ~0.7 MB).
# The release is not part of the site (34.8 GB; Pages allows 1 GB): it is read from the repository variable
# LD_DATA_URL, a host that serves the release with HTTP Range and CORS (docs/history/PLAN.md §6). Takes effect only once
# the repository's Pages source is set to "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test -n "$LD_DATA_URL" || { echo "set the repository variable LD_DATA_URL (the release's URL)"; exit 1; }
        env:
          LD_DATA_URL: ${{ vars.LD_DATA_URL }}
      - run: node tools/build_site.js --data "${{ vars.LD_DATA_URL }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
