      async function submit(event) {
        event.preventDefault();
        let startTime = performance.now();
        const form = event.target;
        const url = form.url.value;
        const snps = form.snps.value
          .split("\n")
          .map((snp) => +snp.trim().replace("rs", ""))
          .filter(Boolean);

        const predicateColumn = "id";
        const predicateValuesMap = snps.reduce((acc, snp) => ({ ...acc, [snp]: true }), {});
        const predicate = (min, max) => (max === undefined) ? predicateValuesMap[min] : snps.some((snp) => min <= snp && snp <= max);
        const data = await queryParquet(url, columns, predicateColumn, predicate);
        let endTime = performance.now();
        console.table(data)

        const chromosome = data[0][2]
        const haplotypesFile = (`haplotypes/1000g/grch37v2/${chromosome}.parquet`);
        const positions = [0].concat(data.map(row => row[3]))
        const positionsValueMap = positions.reduce((acc, pos) => ({ ...acc, [pos]: true }), {});
        const haplotypesPredicate = (min, max) => (max === undefined) ? positionsValueMap[min] : positions.some((pos) => min <= pos && pos <= max);
        const haplotypes = await queryParquet(haplotypesFile, ["pos", "id", "ref", "alt", "samples"], "pos", haplotypesPredicate);
        haplotypes.forEach(row => {
          row[4] = strFromU8(decompressSync(base64ToUint8Array(row[4]))).split(';')
        })
        console.log(haplotypes)


        const duration = endTime - startTime;
        const performanceMessage = `${data.length} records fetched in ${duration} ms`;

        // console.table(data);
        // console.log(performanceMessage);

        const tableData = [columns].concat(data);
        const maxColumnWidths = columns.map((_, i) => Math.max(...tableData.slice(0, 400).map((row) => String(row[i]).length)));

        // console.log(max)

        output.innerText =
          performanceMessage +
          "\n\n" +
          tableData
            .slice(0, 400)
            .map((row) => row.map((v, i) => String(v).padStart(maxColumnWidths[i], " ")).join("\t"))
            .join("\n");
      }

      function base64ToUint8Array(base64) {
          // Decode the base64 string to a binary string
          const binaryString = window.atob(base64);

          // Convert the binary string to an array of character codes
          const charCodes = new Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
              charCodes[i] = binaryString.charCodeAt(i);
          }

          // Create a Uint8Array from the array of character codes
          return new Uint8Array(charCodes);
      }

      async function queryParquet(url, columns, predicateColumn, predicate) {
        // read metadata
        let s1 = performance.now();
        const file = await remoteFileToAsyncBuffer(url);
        // const metadata = await parquetMetadataAsync(file);
        const metadata = window.metadataCache[url] || (await parquetMetadataAsync(file));
        window.metadataCache[url] = metadata;
        const findColumnIndex = (name) => metadata.schema.findIndex((el) => el.name === name) - 1;
        const predicateColumnIndex = findColumnIndex(predicateColumn);
        const columnNameIndexes = columns.map(findColumnIndex);
        const resultsPredicateColumnIndex = columns.indexOf(predicateColumn);

        let s2 = performance.now();
        console.log("metadata read in", s2 - s1, "ms");

        // find row groups containing values that fulfill the predicate
        const rowGroups = metadata.row_groups.filter((group) => {
          const { statistics } = group.columns[predicateColumnIndex].meta_data;
          return predicate(statistics.min_value, statistics.max_value);
        });

        // find column index, offset index, and dictionary locations for each row group's columns
        const indexLocations = rowGroups
          .map((rowGroup) =>
            columnNameIndexes.map((columnNameIndex) => {
              const rowGroupIndex = metadata.row_groups.indexOf(rowGroup);
              const column = rowGroup.columns[columnNameIndex];
              const columnIndexOffset = Number(column.column_index_offset);
              const columnIndexLength = Number(column.column_index_length);
              const offsetIndexOffset = Number(column.offset_index_offset);
              const offsetIndexLength = Number(column.offset_index_length);
              const dictionaryOffset = Number(column.meta_data?.dictionary_page_offset);
              const dataPageOffset = Number(column.meta_data?.data_page_offset);

              return {
                rowGroup: rowGroupIndex,
                column: columnNameIndex,
                columnIndex: [columnIndexOffset, columnIndexOffset + columnIndexLength],
                offsetIndex: [offsetIndexOffset, offsetIndexOffset + offsetIndexLength],
                dictionary: dictionaryOffset ? [dictionaryOffset, dataPageOffset] : null,
              };
            })
          )
          .flat();

        // fetch column index, offset index, and dictionary data for each column
        const [columnIndexData, offsetIndexData, dictionaryData] = await Promise.all([
          file.sliceBatch(indexLocations.map((location) => location.columnIndex)),
          file.sliceBatch(indexLocations.map((location) => location.offsetIndex)),
          file.sliceBatch(indexLocations.map((location) => location.dictionary)),
        ]);

        let s3 = performance.now();
        console.log("index data read in", s3 - s2, "ms");

        // read column index and offset index data
        const columnPageData = indexLocations
          .map((location, i) => {
            const columnIndexReader = { view: new DataView(columnIndexData[i]), offset: 0 };
            const offsetIndexReader = { view: new DataView(offsetIndexData[i]), offset: 0 };
            const column = metadata.row_groups[location.rowGroup].columns[location.column];
            const schemaPath = getSchemaPath(metadata.schema, column.meta_data?.path_in_schema ?? []);
            const schema = schemaPath.at(-1)?.element || { name: "" };

            const columnIndex = readColumnIndex(columnIndexReader, schema);
            const offsetIndex = readOffsetIndex(offsetIndexReader);

            return offsetIndex.page_locations.map((pageLocation, j) => ({
              rowGroup: location.rowGroup,
              column: location.column,
              page: j,
              dictionary: dictionaryData[i],
              offset: Number(pageLocation.offset),
              length: Number(pageLocation.compressed_page_size),
              minValue: columnIndex.min_values[j],
              maxValue: columnIndex.max_values[j],
            }));
          })
          .flat();

        // find pages containing values that fulfill the predicate
        const filteredColumnPageData = columnPageData.filter(
          (p) => p.column === predicateColumnIndex && predicate(p.minValue, p.maxValue)
        );
        const rowGroupPages = groupBy(filteredColumnPageData, (p) => p.rowGroup);
        const pages = columnPageData.filter((page) => rowGroupPages[page.rowGroup].find((rp) => rp.page === page.page));
        console.log(pages)
        window.pages = pages

        // fetch and parse pages
        const pageData = await file.sliceBatch(pages.map((page) => [page.offset, page.offset + page.length]));
        let s4 = performance.now();
        console.log("page data retrieved in", s4 - s3, "ms");

        // let combinedPageData = pages.map((page, i) => ({ ...pages, data: pageData[i] }))
        // console.log("combined page data", combinedPageData)
        // window.combinedPageData = combinedPageData

        // new approach: construct a single array buffer with all page data and read it all at once (so just use readColumn once per rowGroup's column, instead of once per page)


        // old approach (below): read page by page


        const parsedPages = pages
          .map((page, i) => {
            const pageArrayBuffer = concatenateArrayBuffers([page.dictionary, pageData[i]]);
            const pageReader = { view: new DataView(pageArrayBuffer), offset: 0 };
            const column = metadata.row_groups[page.rowGroup].columns[page.column];
            const schemaPath = getSchemaPath(metadata.schema, column.meta_data?.path_in_schema);
            return { page, data: readColumn(pageReader, 1, column.meta_data, schemaPath, { }) };
          })
          .sort(
            (a, b) => a.page.rowGroup - b.page.rowGroup || a.page.page - b.page.page || a.page.column - b.page.column
          );

        let s5 = performance.now();
        console.log("page data read in", s5 - s4, "ms");

        

        /** @type any[][] */
        const data = [];

        // account for column order in each row group
        const columnOrderValues = Array.from(new Set(columnNameIndexes)).sort((a, b) => a - b);
        const columnOrder = columnNameIndexes.map((value) => columnOrderValues.indexOf(value));

        for (let i = 0; i < parsedPages.length; i += columns.length) {
          const rowGroupData = new Array(parsedPages[i].data.length)
            .fill(null)
            .map(() => new Array(columns.length).fill(null));
          for (let j = 0; j < columns.length; j++) {
            const columnData = parsedPages[i + j].data;
            for (let k = 0; k < columnData.length; k++) {
              rowGroupData[k][columnOrder[j]] = columnData[k];
            }
          }
          concat(
            data,
            rowGroupData.filter((row) => predicate(row[resultsPredicateColumnIndex]))
          );
        }

        let s6 = performance.now();
        console.log("data arranged and processed in", s6 - s5, "ms");
        console.log("total time", s6 - s1, "ms")

        return data;
      }

      /**
       * Wraps a remote file in an AsyncBuffer
       * @param {string} url
       * @returns {Promise<import('../src/types.js').AsyncBuffer>}
       */
      export async function remoteFileToAsyncBuffer(url) {
        return {
          byteLength: await getLength(url),
          slice: async (start, end) => {
            return await getBytes(url, start, end);
          },
          sliceBatch: async (ranges) => {
            const requests = chunk(ranges, 100).map((ranges) => getBytesFromRanges(url, ranges));
            const results = await Promise.all(requests);
            return results.flat();
          },
        };
      }

      /**
       * Chunks an array into smaller arrays of the specified size.
       *
       * @param {any[]} list
       * @param {number} size
       * @returns {any[][]}
       */
      function chunk(list, size) {
        return Array.from({ length: Math.ceil(list.length / size) }, (_, i) => list.slice(i * size, i * size + size));
      }

      /**
       * Returns the length of a remote file
       *
       * @param {string} url
       * @returns {Promise<number>}
       */
      export async function getLength(url) {
        const response = await fetch(url, { method: "HEAD", cache: "no-store" });
        return parseInt(response.headers.get("Content-Length"));
      }

      /**
       * Fetches a range of bytes from a remote file
       *
       *
       * @param {url} url
       * @param {number} start
       * @param {number} end
       * @returns {Promise<ArrayBuffer>}
       */
      export async function getBytes(url, start, end) {
        const response = await fetch(url, {
          headers: { Range: `bytes=${start}-${end - 1}` },
          cache: "no-store",
        });
        return await response.arrayBuffer();
      }

      /**
       * Returns an ArrayBuffer[] from a multirange request
       *
       * @param {string} url
       * @param {(null | [number, number])[]} ranges
       * @returns {Promise<ArrayBuffer[]>}
       */
      export async function getBytesFromRanges(url, ranges) {
        const arrayBuffers = new Array(ranges.length).fill(null).map((_) => new ArrayBuffer(0));
        if (!ranges.filter(Boolean).length) return arrayBuffers;

        const headers = {
          range:
            "bytes=" +
            ranges
              .filter(Boolean)
              .map(([start, end]) => [start, end - 1].join("-"))
              .join(","),
        };
        const getRangeIndex = (ranges, contentRange) => {
          const matches = contentRange?.match(/bytes (\d+)-(\d+)\/(\d+)/);
          if (!matches) return -1;
          const start = parseInt(matches[1]);
          const end = 1 + parseInt(matches[2]);
          return ranges.findIndex((r) => r && r[0] === start && r[1] === end);
        };

        const response = await fetch(url, { headers, cache: "no-store" });
        const contentType = response.headers.get("content-type");

        if (contentType?.includes("application/octet-stream")) {
          const contentRange = response.headers.get("content-range");
          const rangeIndex = getRangeIndex(ranges, contentRange);
          arrayBuffers[rangeIndex] = await response.arrayBuffer();
          return arrayBuffers;
        } else if (contentType?.includes("multipart/byteranges")) {
          const boundary = "--" + contentType?.split("boundary=")[1];
          const responseArrayBuffer = await response.arrayBuffer();
          const responseText = new TextDecoder("ascii", { fatal: true }).decode(responseArrayBuffer); // use ascii since it maps nicely to Uint8Array
          const parts = responseText
            .split(boundary)
            .filter((part) => !["", "--"].includes(part.trim()))
            .map((part) => part.split("\r\n\r\n").map((p) => p.replace(/\r\n$/, "")));

          let offset = 0;
          for (const [header, body] of parts) {
            const parsedHeaders = header
              .split("\r\n")
              .filter(Boolean)
              .reduce((acc, line) => {
                const [key, value] = line.split(": ");
                return { ...acc, [key.toLowerCase()]: value };
              }, {});

            const bodyStartIndex = responseText.indexOf(body, offset);
            offset = bodyStartIndex + body.length;
            const bodyArrayBuffer = responseArrayBuffer.slice(bodyStartIndex, offset);

            const rangeIndex = getRangeIndex(ranges, parsedHeaders["content-range"]);
            arrayBuffers[rangeIndex] = bodyArrayBuffer;
          }
        }

        return arrayBuffers;
      }

      /**
       * Concatenate array buffers into a single buffer.
       *
       * @param {ArrayBuffer[]} buffers
       * @returns {ArrayBuffer}
       */
      export function concatenateArrayBuffers(buffers) {
        const bufferLength = buffers.reduce((acc, buffer) => acc + buffer.byteLength, 0);
        const buffer = new ArrayBuffer(bufferLength);
        const array = new Uint8Array(buffer);
        let offset = 0;
        for (const buffer of buffers) {
          array.set(new Uint8Array(buffer), offset);
          offset += buffer.byteLength;
        }
        return buffer;
      }

      /**
       * Groups an array by a predicate function, returning an object with keys as the predicate result.
       *
       * @param {any[]} array
       * @param {(item: any) => string} predicate
       * @returns {Record<string, any[]>}
       */
      export function groupBy(array, predicate) {
        return array.reduce((acc, el) => {
          const key = predicate(el);
          if (!acc[key]) acc[key] = [];
          acc[key].push(el);
          return acc;
        }, {});
      }
