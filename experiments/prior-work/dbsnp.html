      export function jsonBigintSerializer(key, value) {
        return typeof value === 'bigint' ? value.toString() : value;
      }

      export async function getLength(url) {
        const response = await fetch(url, { method: 'HEAD', cache: 'no-store' });
        return parseInt(response.headers.get('Content-Length'));
      }

      export async function getBytes(url, start, end) {
        const response = await fetch(url, {
          headers: { Range: `bytes=${start}-${end - 1}` },
          cache: 'no-store',
        })
        return await response.arrayBuffer();
      }
      
      export async function createAsyncBuffer(url) {
        return { 
          byteLength: await getLength(url),
          slice: async (start, end) => await getBytes(url, start, end)
        }
      }

      function base64ToBuffer(base64) {
          // Decode the base64 string
          const byteCharacters = atob(base64);

          // Create an ArrayBuffer to hold the binary data
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          return new Uint8Array(byteNumbers);
      }

      function decompressBase64(base64) {
        const arrayBuffer = base64ToBuffer(base64);
        return fflate.decompressSync(arrayBuffer)
